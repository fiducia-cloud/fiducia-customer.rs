name: formal-billing-webhook

on:
  pull_request:
    paths:
      - '.github/workflows/formal-billing-webhook.yml'
      - 'formal/**'
      - 'src/billing.rs'
      - 'src/entity/billing_webhook_events.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-billing-webhook.yml'
      - 'formal/**'
      - 'src/billing.rs'
      - 'src/entity/billing_webhook_events.rs'
  schedule:
    - cron: '19 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-billing-webhook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUINT_PACKAGE: '@informalsystems/quint@0.32.0'

jobs:
  model-and-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact customer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/formal-billing-webhook.yml

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin and report Quint
        working-directory: repo
        run: |
          set -euo pipefail
          npx --yes --package="$QUINT_PACKAGE" quint --version

      - name: Typecheck model and deterministic traces
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/billing_webhook_ingest.qnt \
            2>&1 | tee .formal-artifacts/typecheck-model.log
          npx --yes --package="$QUINT_PACKAGE" quint typecheck \
            formal/billing_webhook_ingest_test.qnt \
            2>&1 | tee .formal-artifacts/typecheck-test.log

      - name: Run deterministic state-machine traces
        working-directory: repo
        run: |
          set -euo pipefail
          npx --yes --package="$QUINT_PACKAGE" quint test \
            formal/billing_webhook_ingest_test.qnt \
            --main=billing_webhook_ingest_test \
            --match='.*Test$' \
            --out-itf='.formal-artifacts/test-{test}-{seq}.itf.json' \
            2>&1 | tee .formal-artifacts/quint-test.log

      - name: Simulate bounded ingestion schedules
        working-directory: repo
        run: |
          set -euo pipefail
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/billing_webhook_ingest.qnt \
            --main=billing_webhook_ingest \
            --max-samples=10000 \
            --max-steps=16 \
            --invariant=ingest_safety \
            --witnesses \
              recorded_reached \
              exact_redelivery_reached \
              identity_conflict_reached \
              invalid_signature_reached \
              storage_failure_reached \
            2>&1 | tee .formal-artifacts/quint-run.log

      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: f64cefd987ed16173c526b33a92fb90cbdfcac45
          path: fiducia-interfaces

      - name: Check out pinned payment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 126dc5d1b3fcba289f95139284dc0f3c54b56a8a
          path: fiducia-payments.rs

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy

      - name: Check production refinement
        working-directory: repo
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked billing::tests -- --nocapture

      - name: Retain model evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: billing-webhook-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: repo/.formal-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  bounded-verification:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Java for Apalache
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Exhaustively check the bounded ingestion system
        run: |
          set -euo pipefail
          mkdir -p .formal-artifacts
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/billing_webhook_ingest.qnt \
            --main=billing_webhook_ingest \
            --max-steps=8 \
            --invariant=ingest_safety \
            --out-itf='.formal-artifacts/counterexample-{seq}.itf.json' \
            2>&1 | tee .formal-artifacts/quint-verify.log

      - name: Retain bounded-verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: billing-webhook-bounded-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: .formal-artifacts/
          if-no-files-found: ignore
          retention-days: 14
