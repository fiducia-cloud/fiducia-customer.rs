name: secrets-audit

# Fail-closed, keyless check that no plaintext secret can reach this repository.
# Decryption identities belong only in protected release/runtime environments,
# never pull-request lint jobs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned audit tools
        env:
          JUST_VERSION: 1.51.0
          JUST_ARCHIVE_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
          ORES_SOPS_REF: f152c11f76cc14b2af440b47c756b6c97c0aa36b
          ORES_SOPS_BLOB_SHA: 62c540fbfd56b11ff739c8be1886f767ed80b859
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_ARCHIVE_SHA256}  /tmp/just.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output /tmp/ores-sops \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_REF}/ores-sops"
          test "$(git hash-object /tmp/ores-sops)" = "${ORES_SOPS_BLOB_SHA}"
          sudo install -m 0755 /tmp/ores-sops /usr/local/bin/ores-sops

          just --version
          ores-sops --version

      - name: Verify keyless encrypted-env policy
        env:
          SOPS_AGE_KEY: ""
          SOPS_AGE_KEY_FILE: ""
          ORES_SOPS_VERIFY_DECRYPT: "0"
        run: |
          set -euo pipefail
          just --list
          if ! just env-verify; then
            # Print paths only; never echo the matching line or value.
            age_marker='AGE-SE''CRET-KEY-1'
            pem_marker='-----BEGIN ''PRIVATE KEY-----'
            openssh_marker='-----BEGIN OPENSSH ''PRIVATE KEY-----'
            echo "tracked paths containing blocked private-key signatures:"
            git grep -Il \
              -e "$age_marker" \
              -e "$pem_marker" \
              -e "$openssh_marker" \
              -- . | sed 's/^/  /' || true
            exit 1
          fi
