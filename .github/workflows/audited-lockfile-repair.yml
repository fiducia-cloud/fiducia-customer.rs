name: one-shot audited Rust lockfile security repair

on:
  pull_request:
    paths:
      - ".github/workflows/audited-lockfile-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == 'fiducia-cloud/fiducia-customer.rs' && github.event.pull_request.head.ref == 'hardening/paypal-webhook-consumer-e2e-20261108' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact in-repo proposal branch (never main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hardening/paypal-webhook-consumer-e2e-20261108
          path: repo
      - name: Checkout pinned production interface contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: f64cefd987ed16173c526b33a92fb90cbdfcac45
          path: fiducia-interfaces
      - name: Checkout signed-freshness payments library exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: fiducia-cloud/fiducia-payments.rs
          ref: 5aea61201b76ea174c7f666f1525e646e6fb4f9c
          path: fiducia-payments.rs
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Require synchronized sibling source pins
        working-directory: repo
        run: python3 scripts/check-sibling-pins.py
      - name: Upgrade only vulnerable Rust packages to fixed patch-compatible versions
        working-directory: repo
        run: |
          set -euo pipefail
          cargo +1.97.0 update -p ctutils --precise 0.4.4
          cargo +1.97.0 update -p quinn-proto --precise 0.11.18
          cargo +1.97.0 update -p rustls --precise 0.23.46
          cargo +1.97.0 update -p rustls-webpki --precise 0.103.16
          cargo +1.97.0 update -p webpki-roots@1.0.8 --precise 1.0.10
          cargo +1.97.0 update -p tokio --precise 1.54.1
      - name: Verify locked and formatted code including actual RSA fixtures
        working-directory: repo
        run: |
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 check --locked --all-targets --all-features
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Require zero unsuppressed security vulnerabilities
        working-directory: repo
        run: cargo audit
      - name: Commit reviewed Cargo.lock only to this PR branch
        working-directory: repo
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo "No Cargo.lock updates produced"
            exit 0
          fi
          test -z "$(git diff --name-only -- . ':(exclude)Cargo.lock')" || { echo "unexpected generated files"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "chore(security): upgrade audited Rust dependency graph to patched versions"
          git push origin HEAD:refs/heads/hardening/paypal-webhook-consumer-e2e-20261108
