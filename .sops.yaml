# Public SOPS recipient policy for this repository. Private age identities never
# belong in git, CI, Linear, logs, or chat.

keys:
  - &alex age1qrnva7lnv2jzww6ah5au0cqm4wkvkm5shpzflekdcm4nlu6wnyfqgfaxft # alex@dancingdragons.cc
  - &recovery age1txv6jzlds2s03advmdtnm5l93qh4rkqs50nwvzk9yfvsartzue8se8t7jv # offline recovery

# Only the canonical development and production stores may be committed. A new
# environment name is a policy change, not an ad-hoc file creation.
creation_rules:
  - path_regex: ^env/enc/dev\.env\.enc$
    key_groups:
      - age:
          - *alex
          - *recovery
  - path_regex: ^env/enc/prod\.env\.enc$
    key_groups:
      - age:
          - *alex
          - *recovery
